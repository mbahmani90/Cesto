# Every PR and every push to main: the shared tests on Android (JVM) and the Android app build.
# iOS isn't built in CI for now (run ./gradlew iosSimulatorArm64Test locally).
# No secrets: tests use fakes and MockEngine, so CI never calls Gmail or Gemini.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # "some-with-excludes": matches at least one pattern and none of the ! patterns.
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!art/**'
              - '!LICENSE'

  android:
    name: Android tests + build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # gradle/gradle-daemon-jvm.properties asks for Azul JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests (Android host) and debug APK
        run: ./gradlew testAndroidHostTest :androidApp:assembleDebug --continue
      - name: Test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
      - name: Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # One check for branch protection: passes when every job passed or was skipped (docs-only change).
  ci-result:
    name: CI result
    needs: [changes, android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
