# Push a version tag → signed release APK → GitHub Release (doc 31). GitHub only, no Google Play.
#   git tag v1.0.0 && git push origin v1.0.0
#
#   [ Build signed APK ] ──► [ Publish GitHub Release ]
#     read-only, signing secrets   contents: write, no secrets
#
# Secrets (set once by the owner): CESTO_KEYSTORE_BASE64, CESTO_KEYSTORE_PASSWORD, CESTO_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Never stop a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      # gradle/gradle-daemon-jvm.properties asks for Azul JDK 21.
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # a release reads main's cache, it doesn't write one

      # v1.2.3 → versionName 1.2.3, versionCode 10203 (always grows; minor and patch < 100).
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) || { echo "::error::Minor and patch must be below 100"; exit 1; }
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($CODE)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CESTO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret CESTO_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CESTO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Secrets as environment variables only; the alias and version aren't secrets (they'd be masked in logs).
      - name: Build signed release APK
        env:
          CESTO_KEYSTORE_PASSWORD: ${{ secrets.CESTO_KEYSTORE_PASSWORD }}
          CESTO_KEY_PASSWORD: ${{ secrets.CESTO_KEY_PASSWORD }}
          CESTO_KEY_ALIAS: cesto
        run: >-
          ./gradlew :androidApp:assembleRelease
          -Pcesto.versionName=${{ steps.version.outputs.name }}
          -Pcesto.versionCode=${{ steps.version.outputs.code }}

      # The exit code decides; the certificate lines are only for the log.
      - name: Verify signature
        run: |
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          [ -f "$APK" ] || { echo "::error::No signed APK (was the keystore found?)"; ls androidApp/build/outputs/apk/release/; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256 digest)" || true

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/cesto-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write, and it never sees the signing key.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Cesto $VERSION" --generate-notes --verify-tag
