# Push a version tag → signed release APK → GitHub Release (doc 31), and the signed AAB → Google Play
# internal testing. Production is a separate, manual step: promote.yml.
#   git tag v1.0.0 && git push origin v1.0.0
#
#   [ Build signed APK + AAB ] ──┬─► [ Publish GitHub Release ]       contents: write, no secrets
#     read-only, signing secrets └─► [ Upload to Play (internal) ]    Play service account only
#
# Secrets (set once by the owner): CESTO_KEYSTORE_BASE64, CESTO_KEYSTORE_PASSWORD, CESTO_KEY_PASSWORD,
# the Google config that local.properties holds locally: GOOGLE_WEB_CLIENT_ID, IDENTITY_PLATFORM_API_KEY,
# and PLAY_SERVICE_ACCOUNT_JSON (service account invited in Play Console → Users and permissions).
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Never stop a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      # gradle/gradle-daemon-jvm.properties asks for Azul JDK 21.
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # a release reads main's cache, it doesn't write one

      # v1.2.3 → versionName 1.2.3, versionCode 10203 (always grows; minor and patch < 100).
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) || { echo "::error::Minor and patch must be below 100"; exit 1; }
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($CODE)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CESTO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret CESTO_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CESTO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Secrets as environment variables only; the alias and version aren't secrets (they'd be masked in logs).
      - name: Build signed release APK and AAB
        env:
          CESTO_KEYSTORE_PASSWORD: ${{ secrets.CESTO_KEYSTORE_PASSWORD }}
          CESTO_KEY_PASSWORD: ${{ secrets.CESTO_KEY_PASSWORD }}
          CESTO_KEY_ALIAS: cesto
          # Without these, Google sign-in fails in the release build (build.gradle.kts reads them into BuildConfig).
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          IDENTITY_PLATFORM_API_KEY: ${{ secrets.IDENTITY_PLATFORM_API_KEY }}
        run: |
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] || { echo "::error::Secret GOOGLE_WEB_CLIENT_ID is missing"; exit 1; }
          [ -n "$IDENTITY_PLATFORM_API_KEY" ] || { echo "::error::Secret IDENTITY_PLATFORM_API_KEY is missing"; exit 1; }
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -Pcesto.versionName=${{ steps.version.outputs.name }} \
            -Pcesto.versionCode=${{ steps.version.outputs.code }}

      # The exit code decides; the certificate lines are only for the log.
      - name: Verify signature
        run: |
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          [ -f "$APK" ] || { echo "::error::No signed APK (was the keystore found?)"; ls androidApp/build/outputs/apk/release/; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256 digest)" || true
          AAB=androidApp/build/outputs/bundle/release/androidApp-release.aab
          [ -f "$AAB" ] || { echo "::error::No AAB"; ls androidApp/build/outputs/bundle/release/; exit 1; }
          jarsigner -verify "$AAB" | tee /dev/stderr | grep -q "jar verified" || { echo "::error::AAB is not signed"; exit 1; }

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/cesto-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Only for Google Play, not the GitHub Release.
      - name: Collect Play bundle
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir play
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "play/cesto-$VERSION.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: play/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write, and it never sees the signing key.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Cesto $VERSION" --generate-notes --verify-tag

  google-play:
    name: Upload to Google Play (internal)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: play-bundle
          path: play
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: gem install fastlane --no-document
      # Only the bundle: the store listing is edited in Play Console, not from the repo.
      - name: Upload bundle
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ -n "$SUPPLY_JSON_KEY_DATA" ] || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing"; exit 1; }
          fastlane supply --package_name com.majidbahmani.cesto --aab "play/cesto-$VERSION.aab" \
            --track internal --release_status completed \
            --skip_upload_metadata --skip_upload_changelogs --skip_upload_images --skip_upload_screenshots
