<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>RAG in Cesto: product vectors from Gemini embeddings, search on the phone, SQL for the numbers</title>
  <desc>Part 1: after each sync, only new products (name and category) are sent to Gemini embeddings; the vectors are stored in the product_embedding table on the phone. Part 2: Gemini chat calls semanticSearch with search words; the phone embeds them, compares them with every product vector, and returns product ids and names; Gemini then calls the SQL tools, which compute the totals from receipt_item and receipt; Gemini writes the answer. Gemini never sees vectors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
      .ts { font-size: 12px; fill: #5f5e5a; }
      .tl { font-size: 11px; fill: #5f5e5a; }
      .sec { font-size: 15px; font-weight: 600; fill: #2c2c2a; }
      .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
      .zone { fill: none; stroke: #b4b2a9; stroke-width: 1; stroke-dasharray: 5 4; }
      .div { stroke: #d3d1c7; stroke-width: 1; }
      .store { fill: #e1f5ee; stroke: #1d9e75; }
      .embed { fill: #eeedfe; stroke: #7f77dd; }
      .llm { fill: #faeeda; stroke: #ba7517; }
      .plain { fill: #f1efe8; stroke: #b4b2a9; }
    </style>
  </defs>
  <rect width="900" height="940" fill="#ffffff"/>

  <!-- Zones -->
  <rect class="zone" x="30" y="30" width="440" height="870" rx="8"/>
  <text class="th" x="250" y="54" text-anchor="middle" dominant-baseline="central">On your phone</text>
  <rect class="zone" x="510" y="30" width="370" height="870" rx="8"/>
  <text class="th" x="695" y="54" text-anchor="middle" dominant-baseline="central">Google (your own Gemini key)</text>

  <!-- ===== Part 1: making vectors ===== -->
  <text class="sec" x="60" y="88" dominant-baseline="central">1 · Making vectors: after each sync, new products only</text>

  <rect class="store" x="60" y="110" width="380" height="60" rx="8"/>
  <text class="th" x="250" y="130" text-anchor="middle" dominant-baseline="central">product (the catalog)</text>
  <text class="ts" x="250" y="151" text-anchor="middle" dominant-baseline="central">7 · Iogurte grego natural 4x125 g · Laticinios</text>

  <text class="tl" x="250" y="195" text-anchor="middle" dominant-baseline="central">Products that already have a vector for this model are skipped</text>

  <rect class="store" x="60" y="220" width="380" height="60" rx="8"/>
  <text class="th" x="250" y="240" text-anchor="middle" dominant-baseline="central">product_embedding</text>
  <text class="ts" x="250" y="261" text-anchor="middle" dominant-baseline="central">7 · gemini-embedding-2@768 · [0.66, 0.08, …]</text>

  <rect class="embed" x="540" y="130" width="150" height="130" rx="8"/>
  <text class="th" x="615" y="160" text-anchor="middle" dominant-baseline="central">Gemini</text>
  <text class="th" x="615" y="178" text-anchor="middle" dominant-baseline="central">embeddings</text>
  <text class="ts" x="615" y="204" text-anchor="middle" dominant-baseline="central">text → 768 numbers</text>
  <text class="tl" x="615" y="226" text-anchor="middle" dominant-baseline="central">"title: none | text: …"</text>
  <text class="tl" x="615" y="243" text-anchor="middle" dominant-baseline="central">up to 100 per request</text>

  <line class="arr" x1="442" y1="150" x2="537" y2="150" marker-end="url(#arrow)"/>
  <text class="tl" x="490" y="139" text-anchor="middle" dominant-baseline="central">name + category</text>
  <line class="arr" x1="537" y1="245" x2="443" y2="245" marker-end="url(#arrow)"/>
  <text class="tl" x="490" y="234" text-anchor="middle" dominant-baseline="central">vectors</text>

  <text class="tl" x="250" y="300" text-anchor="middle" dominant-baseline="central">Never sent: prices, quantities, dates, receipt numbers, NIF, card</text>

  <line class="div" x1="30" y1="322" x2="880" y2="322"/>

  <!-- ===== Part 2: answering a question ===== -->
  <text class="sec" x="60" y="348" dominant-baseline="central">2 · Answering a question</text>

  <!-- Gemini chat column -->
  <rect class="llm" x="720" y="370" width="140" height="500" rx="8"/>
  <text class="th" x="790" y="396" text-anchor="middle" dominant-baseline="central">Gemini</text>
  <text class="th" x="790" y="414" text-anchor="middle" dominant-baseline="central">chat + tools</text>
  <text class="tl" x="790" y="436" text-anchor="middle" dominant-baseline="central">picks the tools,</text>
  <text class="tl" x="790" y="451" text-anchor="middle" dominant-baseline="central">writes the answer</text>
  <text class="tl" x="790" y="846" text-anchor="middle" dominant-baseline="central">never sees vectors</text>

  <!-- Question -->
  <rect class="plain" x="60" y="370" width="380" height="60" rx="8"/>
  <text class="th" x="250" y="390" text-anchor="middle" dominant-baseline="central">Question</text>
  <text class="ts" x="250" y="411" text-anchor="middle" dominant-baseline="central">"How much did I spend on dairy in September?"</text>
  <line class="arr" x1="442" y1="392" x2="717" y2="392" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="381" text-anchor="middle" dominant-baseline="central">question + tool list</text>

  <!-- semanticSearch -->
  <rect class="embed" x="60" y="460" width="380" height="100" rx="8"/>
  <text class="th" x="250" y="492" text-anchor="middle" dominant-baseline="central">semanticSearch tool</text>
  <text class="ts" x="250" y="514" text-anchor="middle" dominant-baseline="central">embeds the search words</text>
  <text class="ts" x="250" y="534" text-anchor="middle" dominant-baseline="central">"dairy" → [0.69, 0.12, …]</text>
  <line class="arr" x1="717" y1="474" x2="443" y2="474" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="463" text-anchor="middle" dominant-baseline="central">call semanticSearch("dairy")</text>

  <rect class="embed" x="540" y="495" width="150" height="62" rx="8"/>
  <text class="th" x="615" y="516" text-anchor="middle" dominant-baseline="central">Gemini embeddings</text>
  <text class="tl" x="615" y="537" text-anchor="middle" dominant-baseline="central">"task: search result | query"</text>
  <line class="arr" x1="442" y1="512" x2="537" y2="512" marker-end="url(#arrow)"/>
  <text class="tl" x="490" y="501" text-anchor="middle" dominant-baseline="central">search words</text>
  <line class="arr" x1="537" y1="546" x2="443" y2="546" marker-end="url(#arrow)"/>
  <text class="tl" x="490" y="535" text-anchor="middle" dominant-baseline="central">vector</text>

  <!-- Cosine -->
  <line class="arr" x1="250" y1="562" x2="250" y2="588" marker-end="url(#arrow)"/>
  <rect class="store" x="60" y="590" width="380" height="80" rx="8"/>
  <text class="th" x="250" y="610" text-anchor="middle" dominant-baseline="central">Cosine similarity, in Kotlin</text>
  <text class="ts" x="250" y="631" text-anchor="middle" dominant-baseline="central">query vector vs every product_embedding row</text>
  <text class="ts" x="250" y="651" text-anchor="middle" dominant-baseline="central">top K: 7 Iogurte grego 0.82 · 12 Leite gordo 0.79 · …</text>
  <line class="arr" x1="442" y1="630" x2="717" y2="630" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="619" text-anchor="middle" dominant-baseline="central">ids + names + scores</text>

  <!-- SQL -->
  <rect class="store" x="60" y="700" width="380" height="80" rx="8"/>
  <text class="th" x="250" y="720" text-anchor="middle" dominant-baseline="central">SQL tools</text>
  <text class="ts" x="250" y="741" text-anchor="middle" dominant-baseline="central">sumSpending([7, 12], 2026-09-01, 2026-09-30)</text>
  <text class="ts" x="250" y="761" text-anchor="middle" dominant-baseline="central">receipt_item + receipt → 6,44 €, 4 receipts</text>
  <line class="arr" x1="717" y1="714" x2="443" y2="714" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="703" text-anchor="middle" dominant-baseline="central">call sumSpending(…)</text>
  <line class="arr" x1="442" y1="766" x2="717" y2="766" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="755" text-anchor="middle" dominant-baseline="central">6,44 € · 4 receipts</text>

  <!-- Answer -->
  <rect class="plain" x="60" y="810" width="380" height="60" rx="8"/>
  <text class="th" x="250" y="830" text-anchor="middle" dominant-baseline="central">Answer</text>
  <text class="ts" x="250" y="851" text-anchor="middle" dominant-baseline="central">"You spent 6,44 € on dairy in September." · From 4 receipts</text>
  <line class="arr" x1="717" y1="840" x2="443" y2="840" marker-end="url(#arrow)"/>
  <text class="tl" x="580" y="829" text-anchor="middle" dominant-baseline="central">answer text</text>

  <text class="ts" x="450" y="920" text-anchor="middle" dominant-baseline="central">Vectors find which products · SQL counts how much · Gemini reads names and totals, never vectors</text>
</svg>
