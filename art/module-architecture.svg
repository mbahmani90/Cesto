<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" role="img" aria-labelledby="title desc">
  <title id="title">Cesto module architecture</title>
  <desc id="desc">Platform shells androidApp and iosApp depend on the :app composition root, which depends on the feature modules onboarding and receipts and on the shared modules gmail-auth, systemdesign, core and database. Both platform apps implement the GmailAuthorizer interface from gmail-auth.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1c1c1c; }
    .bg { fill: #ffffff; }
    .h { font-size: 16px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #4a4a4a; }
    .label { font-size: 12px; font-weight: 600; fill: #4a4a4a; letter-spacing: 0.06em; }
    .note { font-size: 11.5px; fill: #4a4a4a; font-style: italic; }
    .shell { fill: #f2f2f2; stroke: #cacaca; }
    .app { fill: #1e7a4f; stroke: #1e7a4f; }
    .app-text .h, .app-text .t { fill: #ffffff; }
    .feature { fill: #cdefd9; stroke: #8fcfa9; }
    .shared { fill: #ffffff; stroke: #9a9a9a; }
    .dep { fill: none; stroke: #7a7a7a; stroke-width: 1.6; }
    .impl { fill: none; stroke: #1e7a4f; stroke-width: 1.6; stroke-dasharray: 6 5; }
    .tip { fill: #7a7a7a; }
    .tip-impl { fill: #1e7a4f; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip-impl" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="800"/>

  <!-- Dependency arrows (drawn first, boxes on top) -->
  <!-- shells -> :app -->
  <path class="dep" d="M250,130 L370,198" marker-end="url(#arrow)"/>
  <path class="dep" d="M730,130 L610,198" marker-end="url(#arrow)"/>
  <!-- :app -> features -->
  <path class="dep" d="M310,290 L270,368" marker-end="url(#arrow)"/>
  <path class="dep" d="M670,290 L710,368" marker-end="url(#arrow)"/>
  <!-- :app -> :gmail-auth (api + exported to Swift, left side) -->
  <path class="dep" d="M240,245 L60,245 L60,568" marker-end="url(#arrow)"/>
  <text class="t" x="68" y="238">api</text>
  <!-- :feature:onboarding -> :gmail-auth, :systemdesign -->
  <path class="dep" d="M180,460 L150,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M340,460 L350,568" marker-end="url(#arrow)"/>
  <!-- :feature:receipts -> :gmail-auth, :systemdesign, :core, :database -->
  <path class="dep" d="M620,460 L225,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M600,460 L430,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M700,460 L600,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M790,460 L800,568" marker-end="url(#arrow)"/>
  <!-- platform apps implement GmailAuthorizer -->
  <path class="impl" d="M90,85 L14,85 L14,615 L28,615" marker-end="url(#arrow-impl)"/>
  <path class="impl" d="M890,85 L964,85 L964,712 L135,712 L135,662" marker-end="url(#arrow-impl)"/>

  <!-- Platform shells -->
  <rect class="shell" x="90" y="40" width="320" height="90" rx="12"/>
  <text class="h" x="108" y="68">androidApp · Kotlin</text>
  <text class="t" x="108" y="92">CestoApp: initKoin(AndroidGmailAuthorizer)</text>
  <text class="t" x="108" y="112">MainActivity · play-services-auth</text>

  <rect class="shell" x="570" y="40" width="320" height="90" rx="12"/>
  <text class="h" x="588" y="68">iosApp · Swift</text>
  <text class="t" x="588" y="92">iOSApp: initKoinIos(GoogleGmailAuthorizer)</text>
  <text class="t" x="588" y="112">GoogleSignIn (Swift Package)</text>

  <!-- Composition root -->
  <rect class="app" x="240" y="200" width="500" height="90" rx="12"/>
  <g class="app-text">
    <text class="h" x="260" y="228">:app</text>
    <text class="t" x="260" y="252">App(): CestoTheme + NavHost · initKoin(all Koin modules)</text>
    <text class="t" x="260" y="272">Builds the iOS framework "Shared" (exports :gmail-auth)</text>
  </g>

  <!-- Features -->
  <rect class="feature" x="110" y="370" width="290" height="90" rx="12"/>
  <text class="h" x="128" y="398">:feature:onboarding</text>
  <text class="t" x="128" y="422">data · domain · presentation</text>
  <text class="t" x="128" y="442">Connect Gmail · Try demo</text>

  <rect class="feature" x="580" y="370" width="290" height="90" rx="12"/>
  <text class="h" x="598" y="398">:feature:receipts</text>
  <text class="t" x="598" y="422">Gmail sync → database → PDF files</text>
  <text class="t" x="598" y="442">Receipt list · pull to refresh</text>

  <!-- Shared modules -->
  <rect class="shared" x="30" y="570" width="210" height="90" rx="12"/>
  <text class="h" x="48" y="598">:gmail-auth</text>
  <text class="t" x="48" y="622">GmailAuthorizer interface</text>
  <text class="t" x="48" y="642">requestAccess() · no deps</text>

  <rect class="shared" x="256" y="570" width="210" height="90" rx="12"/>
  <text class="h" x="274" y="598">:systemdesign</text>
  <text class="t" x="274" y="622">CestoTheme (light + dark)</text>
  <text class="t" x="274" y="642">Compose Material 3</text>

  <rect class="shared" x="482" y="570" width="210" height="90" rx="12"/>
  <text class="h" x="500" y="598">:core</text>
  <text class="t" x="500" y="622">Ktor HttpClient + Koin</text>
  <text class="t" x="500" y="642">OkHttp / Darwin engine</text>

  <rect class="shared" x="708" y="570" width="210" height="90" rx="12"/>
  <text class="h" x="726" y="598">:database</text>
  <text class="t" x="726" y="622">SQLDelight · cesto.db</text>
  <text class="t" x="726" y="642">receipt · gmail_message</text>

  <!-- Layer labels -->
  <rect class="bg" x="417" y="14" width="146" height="20"/>
  <text class="label" x="490" y="28" text-anchor="middle">PLATFORM SHELLS</text>
  <rect class="bg" x="413" y="176" width="154" height="20"/>
  <text class="label" x="490" y="190" text-anchor="middle">COMPOSITION ROOT</text>
  <rect class="bg" x="447" y="338" width="87" height="20"/>
  <text class="label" x="490" y="352" text-anchor="middle">FEATURES</text>
  <rect class="bg" x="518" y="672" width="138" height="20"/>
  <text class="label" x="587" y="686" text-anchor="middle">SHARED MODULES</text>

  <!-- Legend -->
  <path class="dep" d="M30,748 L90,748" marker-end="url(#arrow)"/>
  <text class="t" x="102" y="752">Gradle dependency</text>
  <path class="impl" d="M260,748 L320,748" marker-end="url(#arrow-impl)"/>
  <text class="t" x="332" y="752">implements GmailAuthorizer, passed to initKoin()</text>
  <text class="note" x="30" y="776">:app depends on every module to build the Koin graph; only its edges to the features and :gmail-auth are drawn.</text>
  <text class="note" x="30" y="794">Features never depend on each other; :app wires them with navigation lambdas. Shared modules never depend upward.</text>
</svg>
