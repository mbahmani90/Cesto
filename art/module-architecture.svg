<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" role="img" aria-labelledby="title desc">
  <title id="title">Cesto module architecture</title>
  <desc id="desc">Platform shells androidApp and iosApp depend on the :app composition root, which depends on the feature modules onboarding, chat, receipts and settings and on the shared modules systemdesign, gmail-auth, database, core and llm. Both platform apps implement the GmailAuthorizer interface from gmail-auth.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1c1c1c; }
    .bg { fill: #ffffff; }
    .h { font-size: 16px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #4a4a4a; }
    .label { font-size: 12px; font-weight: 600; fill: #4a4a4a; letter-spacing: 0.06em; }
    .note { font-size: 11.5px; fill: #4a4a4a; font-style: italic; }
    .shell { fill: #f2f2f2; stroke: #cacaca; }
    .app { fill: #1e7a4f; stroke: #1e7a4f; }
    .app-text .h, .app-text .t { fill: #ffffff; }
    .feature { fill: #cdefd9; stroke: #8fcfa9; }
    .shared { fill: #ffffff; stroke: #9a9a9a; }
    .dep { fill: none; stroke: #7a7a7a; stroke-width: 1.6; }
    .impl { fill: none; stroke: #1e7a4f; stroke-width: 1.6; stroke-dasharray: 6 5; }
    .tip { fill: #7a7a7a; }
    .tip-impl { fill: #1e7a4f; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip-impl" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="800"/>

  <!-- Dependency arrows (drawn first, boxes on top) -->
  <!-- shells -> :app -->
  <path class="dep" d="M250,130 L370,198" marker-end="url(#arrow)"/>
  <path class="dep" d="M730,130 L610,198" marker-end="url(#arrow)"/>
  <!-- :app -> features (bottom bar: Ask, Receipts, Settings; onboarding before it) -->
  <path class="dep" d="M300,290 L150,368" marker-end="url(#arrow)"/>
  <path class="dep" d="M410,290 L370,368" marker-end="url(#arrow)"/>
  <path class="dep" d="M570,290 L600,368" marker-end="url(#arrow)"/>
  <path class="dep" d="M680,290 L820,368" marker-end="url(#arrow)"/>
  <!-- :feature:onboarding -> :gmail-auth -->
  <path class="dep" d="M180,460 L260,568" marker-end="url(#arrow)"/>
  <!-- :feature:receipts -> :gmail-auth, :database, :core -->
  <path class="dep" d="M520,460 L330,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M580,460 L500,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M650,460 L640,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M410,460 L455,568" marker-end="url(#arrow)"/>
  <path class="dep" d="M685,460 L790,568" marker-end="url(#arrow)"/>
  <!-- :feature:settings -> :llm -->
  <path class="dep" d="M830,460 L832,568" marker-end="url(#arrow)"/>
  <!-- :llm -> :core (HttpClient) -->
  <path class="dep" d="M750,615 L739,615" marker-end="url(#arrow)"/>
  <!-- platform apps implement GmailAuthorizer -->
  <path class="impl" d="M90,85 L14,85 L14,712 L250,712 L250,662" marker-end="url(#arrow-impl)"/>
  <path class="impl" d="M890,85 L964,85 L964,712 L330,712 L330,662" marker-end="url(#arrow-impl)"/>

  <!-- Platform shells -->
  <rect class="shell" x="90" y="40" width="320" height="90" rx="12"/>
  <text class="h" x="106" y="68">androidApp · Kotlin</text>
  <text class="t" x="106" y="92">CestoApp: initKoin(AndroidGmailAuthorizer)</text>
  <text class="t" x="106" y="112">MainActivity · play-services-auth</text>

  <rect class="shell" x="570" y="40" width="320" height="90" rx="12"/>
  <text class="h" x="586" y="68">iosApp · Swift</text>
  <text class="t" x="586" y="92">iOSApp: initKoinIos(GoogleGmailAuthorizer)</text>
  <text class="t" x="586" y="112">GoogleSignIn (Swift Package)</text>

  <!-- Composition root -->
  <rect class="app" x="240" y="200" width="500" height="90" rx="12"/>
  <g class="app-text">
    <text class="h" x="260" y="228">:app</text>
    <text class="t" x="260" y="252">App(): CestoTheme + bottom bar (Ask · Receipts · Settings)</text>
    <text class="t" x="260" y="272">NavHost · initKoin · iOS framework "Shared" (exports :gmail-auth)</text>
  </g>

  <!-- Features -->
  <rect class="feature" x="40" y="370" width="200" height="90" rx="12"/>
  <text class="h" x="56" y="398">:feature:onboarding</text>
  <text class="t" x="56" y="422">Connect Gmail</text>
  <text class="t" x="56" y="442">Try demo</text>

  <rect class="feature" x="266" y="370" width="200" height="90" rx="12"/>
  <text class="h" x="282" y="398">:feature:chat</text>
  <text class="t" x="282" y="422">Ask tab</text>
  <text class="t" x="282" y="442">agent loop + SQL tools</text>

  <rect class="feature" x="492" y="370" width="200" height="90" rx="12"/>
  <text class="h" x="508" y="398">:feature:receipts</text>
  <text class="t" x="508" y="422">Gmail sync → PDF → text</text>
  <text class="t" x="508" y="442">receipt list</text>

  <rect class="feature" x="718" y="370" width="200" height="90" rx="12"/>
  <text class="h" x="734" y="398">:feature:settings</text>
  <text class="t" x="734" y="422">Gemini key: 2 steps</text>
  <text class="t" x="734" y="442">test · save · remove</text>

  <!-- Shared modules -->
  <rect class="shared" x="30" y="570" width="166" height="90" rx="12"/>
  <text class="h" x="44" y="598">:systemdesign</text>
  <text class="t" x="44" y="622">CestoTheme</text>
  <text class="t" x="44" y="642">CestoScreenTitle</text>

  <rect class="shared" x="210" y="570" width="166" height="90" rx="12"/>
  <text class="h" x="224" y="598">:gmail-auth</text>
  <text class="t" x="224" y="622">GmailAuthorizer</text>
  <text class="t" x="224" y="642">requestAccess()</text>

  <rect class="shared" x="390" y="570" width="166" height="90" rx="12"/>
  <text class="h" x="404" y="598">:database</text>
  <text class="t" x="404" y="622">SQLDelight</text>
  <text class="t" x="404" y="642">receipts · items</text>

  <rect class="shared" x="570" y="570" width="166" height="90" rx="12"/>
  <text class="h" x="584" y="598">:core</text>
  <text class="t" x="584" y="622">Ktor HttpClient</text>
  <text class="t" x="584" y="642">dispatchers · logs</text>

  <rect class="shared" x="750" y="570" width="166" height="90" rx="12"/>
  <text class="h" x="764" y="598">:llm</text>
  <text class="t" x="764" y="622">Gemini REST client</text>
  <text class="t" x="764" y="642">key in Keystore</text>

  <!-- Layer labels -->
  <rect class="bg" x="417" y="14" width="146" height="20"/>
  <text class="label" x="490" y="28" text-anchor="middle">PLATFORM SHELLS</text>
  <rect class="bg" x="413" y="176" width="154" height="20"/>
  <text class="label" x="490" y="190" text-anchor="middle">COMPOSITION ROOT</text>
  <rect class="bg" x="447" y="338" width="87" height="20"/>
  <text class="label" x="490" y="352" text-anchor="middle">FEATURES</text>
  <rect class="bg" x="518" y="672" width="138" height="20"/>
  <text class="label" x="587" y="686" text-anchor="middle">SHARED MODULES</text>

  <!-- Legend -->
  <path class="dep" d="M30,748 L90,748" marker-end="url(#arrow)"/>
  <text class="t" x="102" y="752">Gradle dependency</text>
  <path class="impl" d="M260,748 L320,748" marker-end="url(#arrow-impl)"/>
  <text class="t" x="332" y="752">implements GmailAuthorizer, passed to initKoin()</text>
  <text class="note" x="30" y="776">Not drawn: :app depends on every module (Koin graph); every feature uses :systemdesign; :feature:chat also uses :llm and :core.</text>
  <text class="note" x="30" y="794">Features never depend on each other; :app wires them with navigation lambdas. Shared modules never depend upward.</text>
</svg>
