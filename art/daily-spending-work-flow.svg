<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Daily spending notification: who schedules the job, how WorkManager repeats it, and what doWork() does</title>
  <desc>Part 1: CestoApp.onCreate initialises Koin, which only creates DailySpendingScheduler, then calls schedule(), which enqueues a unique 24-hour periodic job with KEEP: the first time it runs at the next 09:00, later calls change nothing. Disconnect Gmail will call cancel(). Part 2: WorkManager saves the job, survives reboot and app update, and starts the worker around 09:00. Part 3: the worker syncs new receipts from Gmail with a silent token, sums yesterday's total_cents from the receipt table, posts a notification unless there were no receipts, re-pins the next run to tomorrow 09:00 with setNextScheduleTimeOverride, and returns success. WorkManager repeats it every 24 hours; the worker never enqueues itself again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
      .ts { font-size: 12px; fill: #5f5e5a; }
      .tl { font-size: 11px; fill: #5f5e5a; }
      .sec { font-size: 15px; font-weight: 600; fill: #2c2c2a; }
      .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
      .zone { fill: none; stroke: #b4b2a9; stroke-width: 1; stroke-dasharray: 5 4; }
      .store { fill: #e1f5ee; stroke: #1d9e75; }
      .sys { fill: #eeedfe; stroke: #7f77dd; }
      .ext { fill: #faeeda; stroke: #ba7517; }
      .plain { fill: #f1efe8; stroke: #b4b2a9; }
    </style>
  </defs>
  <rect width="900" height="1010" fill="#ffffff"/>

  <!-- ===== 1 · App start ===== -->
  <rect class="zone" x="30" y="30" width="850" height="210" rx="8"/>
  <text class="sec" x="100" y="52" dominant-baseline="central">1 · App start: CestoApp.onCreate()</text>

  <rect class="plain" x="100" y="72" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="92" text-anchor="middle" dominant-baseline="central">initKoin { … }</text>
  <text class="ts" x="270" y="113" text-anchor="middle" dominant-baseline="central">DI creates the scheduler, never calls it</text>

  <line class="arr" x1="270" y1="130" x2="270" y2="150" marker-end="url(#arrow)"/>

  <rect class="plain" x="100" y="152" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="172" text-anchor="middle" dominant-baseline="central">scheduler.schedule()</text>
  <text class="ts" x="270" y="193" text-anchor="middle" dominant-baseline="central">enqueueUniquePeriodicWork(KEEP, 24 h)</text>

  <rect class="plain" x="540" y="72" width="320" height="56" rx="8"/>
  <text class="th" x="700" y="92" text-anchor="middle" dominant-baseline="central">Disconnect Gmail (later)</text>
  <text class="ts" x="700" y="113" text-anchor="middle" dominant-baseline="central">scheduler.cancel() → no more runs</text>

  <line class="arr" x1="442" y1="180" x2="537" y2="180" marker-end="url(#arrow)"/>
  <rect class="plain" x="540" y="152" width="320" height="56" rx="8"/>
  <text class="ts" x="700" y="172" text-anchor="middle" dominant-baseline="central">Not queued yet → first run at next 09:00</text>
  <text class="ts" x="700" y="193" text-anchor="middle" dominant-baseline="central">Already queued → nothing changes</text>

  <!-- ===== 2 · WorkManager ===== -->
  <rect class="zone" x="30" y="255" width="850" height="145" rx="8"/>
  <text class="sec" x="100" y="277" dominant-baseline="central">2 · WorkManager (Android system)</text>

  <line class="arr" x1="270" y1="210" x2="270" y2="303" marker-end="url(#arrow)"/>

  <rect class="sys" x="100" y="305" width="340" height="70" rx="8"/>
  <text class="th" x="270" y="330" text-anchor="middle" dominant-baseline="central">Waits until ~09:00</text>
  <text class="ts" x="270" y="352" text-anchor="middle" dominant-baseline="central">JobScheduler · needs network · Doze may delay</text>

  <rect class="plain" x="540" y="305" width="320" height="70" rx="8"/>
  <text class="ts" x="700" y="326" text-anchor="middle" dominant-baseline="central">Saved in WorkManager's own database:</text>
  <text class="ts" x="700" y="345" text-anchor="middle" dominant-baseline="central">survives reboot and app update</text>
  <text class="tl" x="700" y="363" text-anchor="middle" dominant-baseline="central">Force-stop clears it → next launch schedules again</text>

  <!-- ===== 3 · doWork() ===== -->
  <rect class="zone" x="30" y="415" width="850" height="545" rx="8"/>
  <text class="sec" x="100" y="437" dominant-baseline="central">3 · DailySpendingWorker.doWork()</text>

  <line class="arr" x1="270" y1="377" x2="270" y2="458" marker-end="url(#arrow)"/>

  <!-- Sync -->
  <rect class="plain" x="100" y="460" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="480" text-anchor="middle" dominant-baseline="central">SyncReceiptsUseCase</text>
  <text class="ts" x="270" y="501" text-anchor="middle" dominant-baseline="central">new receipts from Gmail · silent token</text>

  <line class="arr" x1="443" y1="488" x2="537" y2="488" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="tl" x="490" y="477" text-anchor="middle" dominant-baseline="central">sync</text>
  <rect class="ext" x="540" y="460" width="150" height="56" rx="8"/>
  <text class="th" x="615" y="480" text-anchor="middle" dominant-baseline="central">Gmail API</text>
  <text class="tl" x="615" y="501" text-anchor="middle" dominant-baseline="central">gmail.readonly</text>
  <text class="tl" x="705" y="480" dominant-baseline="central">Fails (offline, no access)?</text>
  <text class="tl" x="705" y="498" dominant-baseline="central">→ go on with stored data</text>

  <line class="arr" x1="270" y1="518" x2="270" y2="546" marker-end="url(#arrow)"/>

  <!-- Sum -->
  <rect class="store" x="100" y="548" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="568" text-anchor="middle" dominant-baseline="central">GetYesterdaySpendingUseCase</text>
  <text class="ts" x="270" y="589" text-anchor="middle" dominant-baseline="central">SUM(total_cents) · yesterday 00:00 → 24:00</text>

  <line class="arr" x1="443" y1="576" x2="537" y2="576" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="store" x="540" y="548" width="180" height="56" rx="8"/>
  <text class="th" x="630" y="568" text-anchor="middle" dominant-baseline="central">receipt</text>
  <text class="tl" x="630" y="589" text-anchor="middle" dominant-baseline="central">purchased_at · total_cents</text>

  <line class="arr" x1="270" y1="606" x2="270" y2="628" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon class="plain" points="270,630 350,664 270,698 190,664"/>
  <text class="th" x="270" y="664" text-anchor="middle" dominant-baseline="central">0 receipts?</text>

  <line class="arr" x1="352" y1="664" x2="537" y2="664" marker-end="url(#arrow)"/>
  <text class="tl" x="445" y="653" text-anchor="middle" dominant-baseline="central">yes</text>
  <rect class="plain" x="540" y="642" width="180" height="44" rx="8"/>
  <text class="th" x="630" y="664" text-anchor="middle" dominant-baseline="central">No notification</text>

  <line class="arr" x1="270" y1="700" x2="270" y2="726" marker-end="url(#arrow)"/>
  <text class="tl" x="282" y="712" dominant-baseline="central">no</text>

  <!-- Notify -->
  <rect class="sys" x="100" y="728" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="748" text-anchor="middle" dominant-baseline="central">SpendingNotifier</text>
  <text class="ts" x="270" y="769" text-anchor="middle" dominant-baseline="central">"Yesterday you spent 23,45 € (3 receipts)"</text>

  <line class="arr" x1="270" y1="786" x2="270" y2="812" marker-end="url(#arrow)"/>

  <!-- Re-pin -->
  <rect class="sys" x="100" y="814" width="340" height="56" rx="8"/>
  <text class="th" x="270" y="834" text-anchor="middle" dominant-baseline="central">scheduler.pinNextRun(id)</text>
  <text class="ts" x="270" y="855" text-anchor="middle" dominant-baseline="central">setNextScheduleTimeOverride(tomorrow 09:00)</text>

  <path class="arr" d="M630 688 V842 H443" marker-end="url(#arrow)"/>
  <text class="tl" x="640" y="765" dominant-baseline="central">still re-pin 09:00</text>

  <line class="arr" x1="270" y1="872" x2="270" y2="898" marker-end="url(#arrow)"/>

  <rect class="plain" x="100" y="900" width="340" height="40" rx="8"/>
  <text class="th" x="270" y="920" text-anchor="middle" dominant-baseline="central">Result.success()</text>

  <!-- Repeat loop back to WorkManager -->
  <path class="arr" d="M100 920 H70 V340 H97" marker-end="url(#arrow)"/>
  <text class="tl" x="56" y="630" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 56 630)">every 24 h · the worker never enqueues itself again</text>

  <text class="ts" x="450" y="985" text-anchor="middle" dominant-baseline="central">DI creates it · CestoApp schedules it · WorkManager repeats it · doWork() re-pins 09:00</text>
</svg>
